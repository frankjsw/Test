name: Run Python script

# 触发工作流的事件，这里是推送代码到 main 分支时触发
on:
  push:
    branches:
      - main  # 可以根据需要修改为其他分支

jobs:
  build:
    runs-on: ubuntu-latest  # 选择使用的操作系统（Ubuntu）
    
    steps:
      # 第一步：Checkout 仓库代码
      - name: Checkout code
        uses: actions/checkout@v2

      # 第二步：设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'  # 使用 Python 3.x，替换为你的 Python 版本

      # 第三步：安装项目依赖（如果有 requirements.txt）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # 如果你的项目有依赖，确保有 requirements.txt 文件

      # 第四步：运行 generate_session.py 脚本
      - name: Run generate_session.py
        run: |
          python tools/generate_session.py  # 运行 tools 目录下的 Python 脚本
